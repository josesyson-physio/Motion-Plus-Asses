<title>MotionPlus Assess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column app (max 720px for tablets), sticky header, bottom tab bar on top-level screens, bottom action bar in task flows.
   Single committed look: MotionPlus black with signal yellow, logo red reserved for alerts. */
:root{
  --bg:#0a0a0a; --surface:#141414; --raised:#1b1b1b; --sunk:#202020; --ink:#f6f4ec; --muted:#a19d90; --line:#2a2925;
  --accent:#ffd60a; --accent-ink:#0a0a0a; --accent-soft:#2b2608; --accent-line:#5c4f0a;
  --good:#5bd38b; --good-soft:#12291b; --warn:#ff9f43; --warn-soft:#2f1e0c; --bad:#ff5a4e; --bad-soft:#341412;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:64px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body.has-tabs .app{padding-bottom:calc(var(--tabh) + 28px)}
body.has-bar .app{padding-bottom:112px}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
@media (prefers-reduced-motion:no-preference){
  .app>*{animation:rise .28s cubic-bezier(.2,.7,.2,1) both}
  .app>*:nth-child(2){animation-delay:.04s}
  @keyframes rise{from{opacity:.001;transform:translateY(8px)}}
  button{transition:transform .12s ease,background .15s,border-color .15s,color .15s}
  button:active:not(:disabled){transform:scale(.97)}
}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:16px;margin-inline:-16px;padding-inline:16px}
header h1{font:800 22px/1.1 var(--display);font-stretch:85%;margin:0;flex:1;text-wrap:balance;min-width:0;letter-spacing:-.005em}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.mark{width:38px;height:42px;object-fit:cover;border-radius:9px;flex:none;border:1px solid var(--line)}
.brand{font:500 10.5px var(--mono);color:var(--accent);letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:10px 14px;min-height:44px;font-weight:500}
button:hover:not(:disabled){border-color:#3a3833}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.primary:hover:not(:disabled){background:#ffe14d;border-color:#ffe14d}
.sm{padding:8px 13px;min-height:38px;font-size:14px}
.wide{flex:1}
.ghost{border:none;background:none;color:var(--accent);padding:6px 8px;font-weight:600;min-height:36px}
.back{border:none;background:var(--raised);font-size:24px;line-height:1;width:40px;height:40px;min-height:40px;padding:0 0 3px;border-radius:12px;color:var(--ink);flex:none}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:4px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.sec{font:800 13px var(--display);font-stretch:90%;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:18px 0 2px}
.note{font-size:13px;color:var(--muted);margin:0}
.note.lic{background:var(--warn-soft);color:var(--warn);padding:9px 12px;border-radius:10px;border:1px solid #4a2f12}
.empty{color:var(--muted);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px}
input::placeholder,textarea::placeholder{color:#6f6c63}
textarea{resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1 1 auto}

/* home */
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#171508 0%,#0f0f0f 60%);border:1px solid var(--accent-line);padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.16),transparent 70%);pointer-events:none}
.hero h2{font:800 25px/1.08 var(--display);font-stretch:80%;margin:2px 0 4px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero img{width:86px;height:96px;object-fit:cover;border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:600 24px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;text-align:left;font-size:13.5px;font-weight:600;min-height:84px}
.quick svg{width:22px;height:22px;color:var(--accent)}
.quick .primary svg{color:var(--accent-ink)}

/* patients */
.patient{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:var(--surface)}
.avatar{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 14px var(--mono);flex:none}
.pmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.pname{font-weight:600;font-family:var(--mono);font-size:14.5px}
.psub{color:var(--muted);font-size:13px}
.tag{display:inline-block;font:600 10px var(--body);text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);vertical-align:1px}
.tag.soft{background:none;border:1px solid var(--line)}
.chip{font:600 12px var(--body);padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.neutral{background:var(--accent-soft);color:var(--accent)}
.hist{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:13px 2px}
.hist b{font-weight:600}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.chart svg{width:100%;height:auto;display:block}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ax{font:500 10px var(--mono);fill:var(--muted)}
.ax.strong{font-size:12px;fill:var(--accent);font-weight:700}
.danger{margin-top:22px;padding-top:12px;border-top:1px solid var(--line)}
.link-danger{border:none;background:none;color:var(--bad);padding:8px 0;font-weight:500}
.danger-txt{color:var(--bad)}

/* library */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:7px 13px;min-height:36px;border-radius:999px;font-size:13.5px;background:var(--surface)}
.fchip[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.maker{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px dashed var(--accent-line);background:var(--accent-soft);color:var(--ink);padding:14px 16px;border-radius:16px}
.maker b{font:800 16px var(--display);font-stretch:90%;color:var(--accent)}
.maker span{font-size:13px;color:var(--muted);font-weight:400}
.tool{display:flex;align-items:flex-start;border-bottom:1px solid var(--line)}
.tool-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:none;background:none;border-radius:0;padding:14px 2px}
.tool-main:hover .tname{color:var(--accent)}
.tname{font:700 16px var(--display)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}

/* form */
.form{display:flex;flex-direction:column}
.item{padding-block:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.ilabel{font-weight:600;font-size:15px}
.ilabel small,.lrrow small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:44px;padding:9px 0;flex:1;font:500 15px var(--mono);background:var(--surface)}
.seg button[aria-pressed="true"],.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;font-size:14px;line-height:1.35;background:var(--surface);font-weight:400}
.ov{font:600 13px var(--mono);min-width:26px;height:22px;border-radius:6px;background:var(--sunk);color:var(--accent);display:grid;place-items:center;flex:none}
.opts button[aria-pressed="true"] .ov{background:var(--accent-ink);color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.row-num{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.row-num .ilabel{flex:1;min-width:0}
.unitwrap{display:flex;align-items:center;gap:6px;flex:none}
.unitwrap input{width:96px;text-align:right;font-family:var(--mono)}
.unit{color:var(--muted);font-size:13px;min-width:28px}
.lrrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line)}
.lrrow input,.lrrow select{padding:8px;text-align:right;font-family:var(--mono);min-height:42px}
.lrhead{padding-block:12px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
.lrhead span{text-align:center}

/* bars */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;max-width:720px;width:100%;padding:6px 10px}
.tabs button{flex:1;border:none;background:none;border-radius:14px;height:calc(var(--tabh) - 12px);min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:7}
.bar .in{max-width:688px;width:100%;display:flex;gap:8px;align-items:center}
.bar .in>button{flex:1 1 auto}
.score{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.score b{font:600 20px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.score span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* result */
.result{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.bigrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big{font:600 40px/1.05 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--accent)}
.warnline{font-size:13px;color:var(--warn)}
.alert{background:var(--bad-soft);color:var(--bad);font-weight:600;padding:10px 12px;border-radius:10px;font-size:14px;border:1px solid #5a1f1b}
.change{font-size:14px;font-weight:600;color:var(--muted)}
.change.up{color:var(--good)}.change.down{color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right}
td.muted{color:var(--muted)}
.trh td{font-weight:700;color:var(--accent);padding-top:14px}
.notes{white-space:pre-wrap;margin:0}

/* report */
.rephead{display:flex;gap:12px;align-items:center}
.rephead img{max-height:48px;max-width:120px;object-fit:contain;border-radius:8px}
.repbody{background:#fbfaf5;color:#16150f;border-radius:16px;padding:8px 20px 16px;line-height:1.6;min-width:0;overflow-wrap:anywhere;border-top:6px solid var(--accent)}
.repbody h3{font:800 15px var(--display);font-stretch:90%;text-transform:uppercase;letter-spacing:.06em;color:#16150f;margin:18px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--accent)}
.repbody p{margin:6px 0}
.repbody ul{margin:4px 0;padding-left:20px}
.repbody li::marker{color:#b89400}
.repbody .empty{color:#6f6c63;border-color:#d9d5c4}
.thinking{color:#6f6c63}
@media (prefers-reduced-motion:no-preference){.thinking{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}
.watermark{display:flex;justify-content:center;padding-top:10px;opacity:.5}
.watermark img{width:44px;height:50px;object-fit:cover;border-radius:8px}

/* builder */
.aibox{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.aibox .label{color:var(--accent)}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:44px;position:relative;align-self:flex-start}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0}
.upchip{display:inline-flex;align-items:center;gap:2px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 12px;font-size:13px;max-width:100%;overflow-wrap:anywhere}
.upchip .ghost{min-height:30px;padding:2px 8px;color:var(--muted)}
.upstatus{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line)}
.upstatus.good{color:var(--good);background:var(--good-soft);border-color:#1f4a2e}
.upstatus.warn{color:var(--warn);background:var(--warn-soft);border-color:#4a2f12}
.upstatus.bad{color:var(--bad);background:var(--bad-soft);border-color:#5a1f1b}
.filebtn svg{width:20px;height:20px;color:var(--accent)}
.pdfpage{width:100%;height:auto;border-radius:10px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.icard-top{display:flex;gap:8px;align-items:center}
.icard-top select{flex:1;min-width:0}
.iorder{display:flex}
.iorder .ghost{min-width:36px;padding:6px}
.logo-row{display:flex;gap:14px;align-items:center}
.logo-prev{width:96px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px}
.empty-logo{display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--sunk)}
@media (max-width:380px){.quick{grid-template-columns:1fr 1fr}.hero img{width:64px;height:72px}}
@media (min-width:600px){.big{font-size:46px}header h1{font-size:25px}.hero h2{font-size:30px}}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" aria-label="Main"><div class="in">
  <button data-act="tab" data-tab="patients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .7 3.2 2.4 3.5 5.2"/></svg>Home</button>
  <button data-act="tab" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 3.5V2.5h6v1M8.5 9h7M8.5 12.5h7M8.5 16h4"/></svg>Assessments</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

function chartSVG(s, t) {

  const pts = s.map((p, i) => [x(i), y(p.val), p]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts.at(-1)[0]},${y(lo)} L${pts[0][0]},${y(lo)} Z`;
  const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>${i === 0 || i === pts.length - 1 || s.length <= 5 ? `<text x="${p[0]}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}" class="ax">${fmtShort(p[2].date)}</text>` : ""}`).join("");
  const last = pts.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.name)} over time">${grid}<path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${last[0] - 9}" y="${last[1] - 9}" text-anchor="end" class="ax strong">${nice(last[2].val)}</text></svg>`;
}

/* ---------- AI reports ---------- */
const REPORT_RULES = `You are a senior rehabilitation clinician writing a professional clinical report for a rehabilitation clinic (physiotherapy, occupational therapy, speech and language therapy, behavioural and sensory services). The report must read like one written by an experienced specialist: precise, evidence-based, and easy to follow for referrers, the treating team and families.

Rules:
- Use only the data provided. Never invent results, history, diagnoses or test names. If key information is missing, say what should be assessed next.
- The patient is identified only by a code. Never add or guess a name.
- Interpret every score against the published cut-offs, norms and bands given in the data. State whether change between dates is clinically meaningful when a threshold is given.
- Link impairments to activity and participation (ICF framework) and to safety risks such as falls, aspiration or self-harm where the data supports it. Flag any urgent safety item first.
- Write in clear professional English. Short paragraphs and bullet points. No filler.
- Format: plain text. Section headings are lines starting with "## ". Bullets are lines starting with "- ". Use **double asterisks** for key figures. No tables, no other markdown.

Sections, in this order:
## Summary
## Assessment findings
## Clinical interpretation
## Functional impact and risks
## Goals
(2–3 short-term goals for the next 2–4 weeks and 1–2 long-term goals; all SMART and measurable with the tests used)
## Recommendations and plan
(intervention focus, frequency, home programme, onward referrals, when to reassess)
## Summary for the patient and family
(3–5 sentences in plain words, no jargon)

End with this exact line: Clinician review required before release.`;

function patientBlock(p) { return `Patient code: ${p.code}\nAge: ${p.age} years\nSex: ${p.sex}\nDiagnosis / reason for referral: ${p.dx || "not recorded"}\nReferred by: ${p.ref || "not recorded"}${p.notes ? `\nBackground: ${p.notes}` : ""}`; }
function assessmentBlock(a, p) {
  const t = getTpl(a), r = runScore(t, a.values, p), c = compare(t, a, p);
  const items = t.fields.filter(f => f.t !== "head" && has(a.values[f.id])).map(f => `- ${f.label}: ${fmtVal(f, a.values[f.id])}`).join("\n");
  return `### ${t.name}${t.short ? ` (${t.short})` : ""}, ${a.date}
Result: ${r.txt}. Band: ${r.band[0]}.${r.of && r.done < r.of ? ` Incomplete: ${r.done}/${r.of} items scored.` : ""}
${r.lines.join("\n")}
${t.mcid ? `Clinically meaningful change threshold (MCID/MDC): ${t.mcid}${t.unit ? " " + t.unit : ""}. Higher is ${t.hb ? "better" : "worse"}.` : t.hb !== undefined ? `Higher is ${t.hb ? "better" : "worse"}.` : ""}
${c && c.d != null ? `Change since ${c.prev.date}: ${c.d > 0 ? "+" : ""}${c.d}.` : ""}
${t.lic ? `Note: ${t.lic}` : ""}
Items:
${items || "- none recorded"}
${a.notes ? `Clinician notes: ${a.notes}` : ""}`.replace(/\n{2,}/g, "\n");

Report type: ${rep.kind === "progress" ? "Progress report across all assessments on file. Compare the earliest and latest results for each test and describe the trend." : "Single assessment report."}
Clinic: ${s.clinic || "MotionPlus Physio"}${s.therapist ? `\nAssessing clinician: ${s.therapist}` : ""}

let aiCtl = null, streaming = null;
function startReport(pid, aids, kind) {

function basicReport(rep) {

  const rows = list.map(a => { const t = getTpl(a); return { a, t, r: runScore(t, a.values, p), c: compare(t, a, p) }; });
  const latest = Object.values(rows.reduce((m, x) => (m[x.a.tid] = x, m), {}));

function pdfSafe(s) { return String(s ?? "").replace(/≥/g, ">=").replace(/≤/g, "<=").replace(/→/g, "->").replace(/₂/g, "2").replace(/✦/g, "").replace(/[^\x00-\xFF–—‘’“”•…]/g, ""); }

  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...MUTED); doc.text(fmt(today()), W - M, y + 11.5, { align: "right" });

}
function pdfChart(doc, x, y, w, h, s, t, C) {

  doc.setDrawColor(...C.GOLD); doc.setLineWidth(0.8);
  for (let i = 1; i < s.length; i++) doc.line(px(i - 1), py(s[i - 1].val), px(i), py(s[i].val));

}
