<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MotionPlus Pro</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MotionPlus">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="MotionPlus Pro: digital rehab assessments, posture and gait analysis, progress charts and professional reports for physiotherapy, occupational therapy, speech, sensory and behavioural care.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-column app (max 720px for tablets), sticky header, bottom tab bar on top-level screens, bottom action bar in task flows.
   Single committed look: MotionPlus black with signal yellow, logo red reserved for alerts. */
:root{
  --bg:#0a0a0a; --surface:#141414; --raised:#1b1b1b; --sunk:#202020; --ink:#f6f4ec; --muted:#b5b1a4; --line:#2a2925;
  --accent:#ffd60a; --accent-ink:#0a0a0a; --accent-soft:#2b2608; --accent-line:#5c4f0a;
  --good:#5bd38b; --good-soft:#12291b; --warn:#ff9f43; --warn-soft:#2f1e0c; --bad:#ff5a4e; --bad-soft:#341412;
  --display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --body:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:64px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0}
[hidden]{display:none!important}
body{color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
body.has-tabs .app{padding-bottom:calc(var(--tabh) + 28px)}
body.has-bar .app{padding-bottom:112px}
.app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
@media (prefers-reduced-motion:no-preference){
  button{transition:transform .12s ease,background .15s,border-color .15s,color .15s}
  button:active:not(:disabled){transform:scale(.97)}
}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:16px;margin-inline:-16px;padding-inline:16px}
header h1{font:800 22px/1.1 var(--display);font-stretch:85%;margin:0;flex:1;text-wrap:balance;min-width:0;letter-spacing:-.005em}
.grow{flex:1;min-width:0;display:flex;flex-direction:column}
.mark{width:38px;height:42px;object-fit:cover;border-radius:9px;flex:none;border:1px solid var(--line)}
.brand{font:500 10.5px var(--mono);color:var(--accent);letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:10px 14px;min-height:44px;font-weight:500}
button:hover:not(:disabled){border-color:#3a3833}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.primary:hover:not(:disabled){background:#ffe14d;border-color:#ffe14d}
.sm{padding:8px 13px;min-height:38px;font-size:14px}
.wide{flex:1}
.ghost{border:none;background:none;color:var(--accent);padding:6px 8px;font-weight:600;min-height:36px}
.back{border:none;background:var(--raised);font-size:24px;line-height:1;width:40px;height:40px;min-height:40px;padding:0 0 3px;border-radius:12px;color:var(--ink);flex:none}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.tight{gap:4px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.sec{font:800 13px var(--display);font-stretch:90%;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:18px 0 2px}
.note{font-size:13px;color:var(--muted);margin:0}
.note.lic{background:var(--warn-soft);color:var(--warn);padding:9px 12px;border-radius:10px;border:1px solid #4a2f12}
.empty{color:var(--muted);font-size:14px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:14px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px}
input::placeholder,textarea::placeholder{color:#8a867b}
textarea{resize:vertical;line-height:1.45}
.field{display:flex;flex-direction:column;gap:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{flex:1 1 auto}

/* home */
.hero{position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#171508 0%,#0f0f0f 60%);border:1px solid var(--accent-line);padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,10,.16),transparent 70%);pointer-events:none}
.hero h2{font:800 25px/1.08 var(--display);font-stretch:80%;margin:2px 0 4px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.hero h2 em{font-style:normal;color:var(--accent)}
.hero img{width:86px;height:96px;object-fit:cover;border-radius:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:600 24px/1.1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.stat span{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:560px){.quick{grid-template-columns:repeat(4,1fr)}}
.quick .qfile{position:relative;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink)}
.quick .qfile input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0;width:100%}
.quick .qfile:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.quick button,.quick .qfile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;text-align:left;font-size:13.5px;font-weight:600;min-height:84px}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px 0}
.lock img{width:84px;height:94px;object-fit:cover;border-radius:16px}
.lock h1{font:800 26px/1.1 var(--display);margin:0}
.lock form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.lock input{text-align:center;font:600 24px var(--mono);letter-spacing:.3em}
.lock .err{color:var(--bad);min-height:1.5em;margin:0}
.headlock{width:44px;padding:0;display:grid;place-items:center}
.headlock svg{width:20px;height:20px}
.quick svg{width:22px;height:22px;color:var(--accent)}
.quick .primary svg{color:var(--accent-ink)}

/* patients */
.patient{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:var(--surface)}
.avatar{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 14px var(--mono);flex:none}
.pmeta{flex:1;min-width:0;display:flex;flex-direction:column}
.pname{font-weight:600;font-family:var(--mono);font-size:14.5px}
.psub{color:var(--muted);font-size:13px}
.tag{display:inline-block;font:600 10px var(--body);text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);vertical-align:1px}
.tag.soft{background:none;border:1px solid var(--line)}
@media (max-width:400px){.patient{flex-wrap:wrap}.patient .pmeta{flex:1 1 150px}.patient>.chip{margin-left:58px;white-space:normal;max-width:calc(100% - 58px)}}
.chip{font:600 12px var(--body);padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.neutral{background:var(--accent-soft);color:var(--accent)}
.hist{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:13px 2px}
.hist b{font-weight:600}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.chart svg{width:100%;height:auto;max-height:260px;display:block}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ax{font:500 10px var(--mono);fill:var(--muted)}
.ax.strong{font-size:12px;fill:var(--accent);font-weight:700}
.danger{margin-top:22px;padding-top:12px;border-top:1px solid var(--line)}
.link-danger{border:none;background:none;color:var(--bad);padding:8px 0;font-weight:500}
.danger-txt{color:var(--bad)}

/* library */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{padding:7px 13px;min-height:36px;border-radius:999px;font-size:13.5px;background:var(--surface)}
.fchip[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.maker{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px dashed var(--accent-line);background:var(--accent-soft);color:var(--ink);padding:14px 16px;border-radius:16px}
.maker b{font:800 16px var(--display);font-stretch:90%;color:var(--accent)}
.maker span{font-size:13px;color:var(--muted);font-weight:400}
.tool{display:flex;align-items:flex-start;border-bottom:1px solid var(--line)}
.tool-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:none;background:none;border-radius:0;padding:14px 2px}
.tool-main:hover .tname{color:var(--accent)}
.tname{font:700 16px var(--display)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}

/* form */
.form{display:flex;flex-direction:column}
.item{padding-block:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.ilabel{font-weight:600;font-size:15px}
.ilabel small,.lrrow small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:44px;padding:9px 0;flex:1;font:500 15px var(--mono);background:var(--surface)}
.seg button[aria-pressed="true"],.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;font-size:14px;line-height:1.35;background:var(--surface);font-weight:400}
.ov{font:600 13px var(--mono);min-width:26px;height:22px;border-radius:6px;background:var(--sunk);color:var(--accent);display:grid;place-items:center;flex:none}
.opts button[aria-pressed="true"] .ov{background:var(--accent-ink);color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted)}
.row-num{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.row-num .ilabel{flex:1;min-width:0}
.unitwrap{display:flex;align-items:center;gap:6px;flex:none}
.unitwrap input{width:96px;text-align:right;font-family:var(--mono)}
.unit{color:var(--muted);font-size:13px;min-width:28px}
.lrrow{display:grid;grid-template-columns:1fr 84px 84px;gap:8px;align-items:center;padding-block:9px;border-bottom:1px solid var(--line)}
.lrrow input,.lrrow select{padding:8px;text-align:right;font-family:var(--mono);min-height:42px}
.lrhead{padding-block:12px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
.lrhead span{text-align:center}

/* bars */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{display:flex;max-width:720px;width:100%;padding:6px 10px}
.tabs button{flex:1;border:none;background:none;border-radius:14px;height:calc(var(--tabh) - 12px);min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 6px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tabs svg{width:22px;height:22px;flex:none}
.tabs button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
.bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:7}
.bar .in{max-width:688px;width:100%;display:flex;gap:8px;align-items:center}
.bar .in>button{flex:1 1 auto}
.score{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.score b{font:600 20px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.score span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}

/* result */
.result{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.bigrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.big{font:600 40px/1.05 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;color:var(--accent)}
.warnline{font-size:13px;color:var(--warn)}
.alert{background:var(--bad-soft);color:var(--bad);font-weight:600;padding:10px 12px;border-radius:10px;font-size:14px;border:1px solid #5a1f1b}
.change{font-size:14px;font-weight:600;color:var(--muted)}
.change.up{color:var(--good)}.change.down{color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
tr:last-child td{border-bottom:none}
th{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{text-align:right}
td.muted{color:var(--muted)}
.trh td{font-weight:700;color:var(--accent);padding-top:14px}
.notes{white-space:pre-wrap;margin:0}

/* report */
.rephead{display:flex;gap:12px;align-items:center}
.rephead img{max-height:48px;max-width:120px;object-fit:contain;border-radius:8px}
.repbody{background:#fbfaf5;color:#16150f;border-radius:16px;padding:8px 20px 16px;line-height:1.6;min-width:0;overflow-wrap:anywhere;border-top:6px solid var(--accent)}
.repbody h2{font:800 15px var(--display);font-stretch:90%;text-transform:uppercase;letter-spacing:.06em;color:#16150f;margin:18px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--accent)}
.repbody p{margin:6px 0}
.repbody ul{margin:4px 0;padding-left:20px}
.repbody li::marker{color:#b89400}
.repbody .empty{color:#6f6c63;border-color:#d9d5c4}
.thinking{color:#6f6c63}
@media (prefers-reduced-motion:no-preference){.thinking{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}
.watermark{display:flex;justify-content:center;padding-top:10px;opacity:.5}
.watermark img{width:44px;height:50px;object-fit:cover;border-radius:8px}

/* builder */
.aibox{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.aibox .label{color:var(--accent)}
.filebtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:500;min-height:44px;position:relative;align-self:flex-start}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0}
.upchip{display:inline-flex;align-items:center;gap:2px;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 12px;font-size:13px;max-width:100%;overflow-wrap:anywhere}
.upchip .ghost{min-height:30px;padding:2px 8px;color:var(--muted)}
.upstatus{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line)}
.upstatus.good{color:var(--good);background:var(--good-soft);border-color:#1f4a2e}
.upstatus.warn{color:var(--warn);background:var(--warn-soft);border-color:#4a2f12}
.upstatus.bad{color:var(--bad);background:var(--bad-soft);border-color:#5a1f1b}
.filebtn svg{width:20px;height:20px;color:var(--accent)}
.pdfpage{width:100%;height:auto;border-radius:10px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.icard-top{display:flex;gap:8px;align-items:center}
.icard-top select{flex:1;min-width:0}
.iorder{display:flex}
.iorder .ghost{min-width:36px;padding:6px}
.logo-row{display:flex;gap:14px;align-items:center}
.logo-prev{width:96px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:12px;background:#fff;padding:6px}
.empty-logo{display:grid;place-items:center;color:var(--muted);font-size:12px;background:var(--sunk)}
@media (max-width:380px){.hero img{width:64px;height:72px}}
@media (min-width:600px){.big{font-size:46px}header h1{font-size:25px}.hero h2{font-size:30px}}
/* ---------- About page (Inclusive.Si): every rule is scoped under .isi ---------- */
/* Layout concept: a dark navy brand stage (the logo screenshot, alive) with concentric rings radiating from the eye.
   One scoped column below it: statement, origin, five animated app screens in a swipe rail, the pod loop, inclusion orbit, bloom radar, network.
   Everything is scoped under .isi with --isi- tokens so the block can be dropped into any app without touching that app's styles. */
.isi {
  --isi-bg: #0c1220;
  --isi-surface: #111a31;
  --isi-raise: #172046;
  --isi-line: rgba(170, 182, 255, 0.16);
  --isi-fg: #f5f6ff;
  --isi-muted: #a4acc8;
  --isi-accent: #7a87ff;
  --isi-accent-ink: #0c1220;
  --isi-glow: rgba(38, 50, 170, 0.55);
  --isi-pupil-hi: #c3c9ff;
  --isi-pupil-lo: #5560ff;
  --isi-teal: #34d6c0;
  --isi-amber: #ffb547;
  --isi-rose: #ff7ea8;
  --isi-phone: #060912;
  --isi-scr: #f6f7ff;
  --isi-scr-card: #ffffff;
  --isi-scr-ink: #0c1220;
  --isi-scr-mute: #6a7290;
  --isi-scr-line: #dfe3f8;
  --isi-s-indigo: #3b45ff;
  --isi-s-teal: #0f9d8f;
  --isi-s-rose: #d63b73;
  --isi-s-amber: #e08a00;
  --isi-cine: #0b0f1f;
  --isi-cine-2: #151b36;
  --isi-display: "Poppins", "Helvetica Neue", Arial, sans-serif;
  --isi-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

.isi, .isi * { box-sizing: border-box; }
.isi {
  background: var(--isi-bg);
  color: var(--isi-fg);
  font-family: var(--isi-display);
  font-size: 16px;
  line-height: 1.6;
  padding-block: 0 64px;
  overflow-x: clip;
  -webkit-text-size-adjust: 100%;
}
.isi h1, .isi h2, .isi h3, .isi p, .isi ul, .isi ol, .isi figure { margin: 0; padding: 0; }
.isi ul, .isi ol { list-style: none; }
.isi a { color: inherit; }
.isi svg { display: block; }
.isi-wrap { width: 100%; max-width: 1080px; margin-inline: auto; padding-inline: clamp(16px, 5vw, 48px); }
.isi-label { font-family: var(--isi-mono); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--isi-accent); }
.isi h2 { font-size: clamp(28px, 5.6vw, 46px); font-weight: 600; line-height: 1.12; letter-spacing: -0.015em; text-wrap: balance; }
.isi h3 { font-size: 18px; font-weight: 600; line-height: 1.3; }
.isi-lede { color: var(--isi-muted); max-width: 62ch; font-size: 17px; }
.isi-sec { padding-block: clamp(64px, 10vw, 112px) 0; display: grid; gap: 32px; }
.isi-head { display: grid; gap: 14px; max-width: 780px; }
.isi-small { font-family: var(--isi-mono); font-size: 12px; color: var(--isi-muted); }

/* ---------- Hero: the brand screenshot, alive ---------- */
.isi-hero { position: relative; isolation: isolate; padding-block: clamp(40px, 8vw, 88px) clamp(48px, 8vw, 80px); }
.isi-stage { position: relative; display: grid; justify-items: center; text-align: center; gap: 22px; }
.isi-eyewrap { position: relative; width: min(300px, 64vw); display: grid; place-items: center; animation: isi-rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
.isi-rings { position: absolute; left: 50%; top: 50%; width: min(1180px, 240vw); aspect-ratio: 1; transform: translate(-50%, -50%); z-index: -1; pointer-events: none; background: radial-gradient(circle at center, var(--isi-glow), transparent 46%); }
.isi-rings svg { width: 100%; height: 100%; overflow: visible; }
.isi-ring { fill: none; stroke: var(--isi-line); stroke-width: 1.2; }
.isi-wave { fill: none; stroke: var(--isi-accent); stroke-width: 1.4; opacity: 0; transform-box: fill-box; transform-origin: center; animation: isi-ripple 9s linear infinite; }
.isi-wave:nth-of-type(2) { animation-delay: -3s; }
.isi-wave:nth-of-type(3) { animation-delay: -6s; }
@keyframes isi-ripple { 0% { transform: scale(0.2); opacity: 0; } 14% { opacity: 0.6; } 100% { transform: scale(1); opacity: 0; } }
.isi-eye-svg { width: 100%; height: auto; overflow: visible; color: var(--isi-fg); }
.isi-blink { transform-box: fill-box; transform-origin: center; animation: isi-blink 7s ease-in-out infinite; }
@keyframes isi-blink { 0%, 91%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(0.07); } }
.isi-iris { transform-origin: 0 0; animation: isi-spin 22s linear infinite; }
@keyframes isi-spin { to { transform: rotate(360deg); } }
.isi-pupil { transform-box: fill-box; transform-origin: center; animation: isi-pulse 3.6s ease-in-out infinite; filter: drop-shadow(0 0 9px var(--isi-pupil-lo)); }
@keyframes isi-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
.isi-word { font-size: clamp(40px, 11vw, 76px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.05; animation: isi-rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both; }
.isi-word b { font-weight: 700; }
.isi-word i { font-style: normal; color: var(--isi-pupil-lo); font-weight: 700; }
.isi-tag { font-size: 12px; font-weight: 500; letter-spacing: 0.5em; text-transform: uppercase; color: var(--isi-muted); padding-left: 0.5em; animation: isi-rise 1.1s .3s cubic-bezier(.2,.7,.2,1) both; }
.isi-quote { max-width: 26ch; font-size: clamp(22px, 4.6vw, 34px); font-weight: 300; line-height: 1.3; text-wrap: balance; animation: isi-rise 1.1s .45s cubic-bezier(.2,.7,.2,1) both; }
.isi-quote b { font-weight: 600; background: linear-gradient(100deg, var(--isi-fg) 20%, var(--isi-accent) 50%, var(--isi-fg) 80%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; animation: isi-shimmer 6s ease-in-out infinite; }
@keyframes isi-shimmer { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
@keyframes isi-rise { from { transform: translateY(18px); opacity: 0.001; } to { transform: none; opacity: 1; } }

.isi-cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; margin-top: 6px; }
.isi-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; padding: 14px 26px; border-radius: 999px; font-weight: 600; font-size: 16px; text-decoration: none; border: 1.5px solid var(--isi-accent); flex: 1 1 210px; max-width: 300px; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; -webkit-tap-highlight-color: transparent; }
.isi-btn svg { width: 20px; height: 20px; flex: none; }
.isi .isi-btn--solid { background: var(--isi-accent); color: var(--isi-accent-ink); }
.isi-btn--ghost { background: transparent; color: var(--isi-fg); }
.isi-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 34px var(--isi-glow); }
.isi-btn--ghost:hover { background: var(--isi-raise); }
.isi-btn:focus-visible { outline: 3px solid var(--isi-fg); outline-offset: 3px; }

/* ---------- Marquee ---------- */
.isi-marq { overflow: hidden; border-block: 1px solid var(--isi-line); padding-block: 18px; }
.isi-marq-track { display: flex; width: max-content; animation: isi-marq 46s linear infinite; }
.isi-marq:hover .isi-marq-track { animation-play-state: paused; }
.isi-marq-set { display: flex; align-items: center; gap: 28px; padding-right: 28px; }
.isi-marq-set span { font-size: clamp(18px, 3vw, 26px); font-weight: 300; color: var(--isi-muted); white-space: nowrap; }
.isi-marq-set span b { color: var(--isi-fg); font-weight: 500; }
.isi-sep { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--isi-accent); position: relative; }
.isi-sep::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--isi-accent); }
@keyframes isi-marq { to { transform: translateX(-50%); } }

/* ---------- About statement ---------- */
.isi-about { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: clamp(24px, 5vw, 56px); align-items: center; }
.isi-statement { font-size: clamp(22px, 4.2vw, 36px); font-weight: 300; line-height: 1.35; text-wrap: pretty; }
.isi-statement b { font-weight: 600; }
.isi-statement em { font-style: normal; font-weight: 600; background: linear-gradient(100deg, var(--isi-accent) 25%, var(--isi-fg) 50%, var(--isi-accent) 75%); background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; animation: isi-shimmer 7s ease-in-out infinite; }
.isi-brandcard { position: relative; display: grid; justify-items: center; gap: 14px; text-align: center; padding: 32px 22px; border-radius: 24px; background: radial-gradient(circle at 50% 28%, var(--isi-glow), transparent 68%), var(--isi-surface); border: 1px solid var(--isi-line); overflow: hidden; }
.isi-brandcard .isi-eye-svg { width: 150px; }
.isi-brandcard p { font-size: 14px; color: var(--isi-muted); max-width: 30ch; }
.isi-brandcard .isi-miniword { font-size: 26px; font-weight: 300; letter-spacing: -0.01em; }
.isi-miniword b { font-weight: 700; }
.isi-miniword i { font-style: normal; color: var(--isi-pupil-lo); font-weight: 700; }
@media (max-width: 760px) { .isi-about { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Origin ---------- */
.isi-origin { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.isi-panel { background: var(--isi-surface); border: 1px solid var(--isi-line); border-radius: 22px; padding: clamp(18px, 3vw, 28px); display: grid; gap: 14px; align-content: start; min-width: 0; }
.isi-people svg { width: 100%; height: auto; }
.isi-person { fill: var(--isi-muted); opacity: 0.55; animation: isi-awake 9s ease-in-out infinite; animation-delay: calc(var(--i) * 0.55s - 6.2s); }
@keyframes isi-awake { 0%, 12% { fill: var(--isi-muted); opacity: 0.55; } 24%, 82% { fill: var(--isi-accent); opacity: 1; } 94%, 100% { fill: var(--isi-muted); opacity: 0.55; } }
.isi-spark { font-family: var(--isi-mono); font-size: 11px; fill: var(--isi-accent); opacity: 0; animation: isi-sparkin 9s ease-in-out infinite; animation-delay: calc(var(--i) * 0.55s - 6.2s); }
@keyframes isi-sparkin { 0%, 14% { opacity: 0; transform: translateY(4px); } 28%, 80% { opacity: 1; transform: none; } 92%, 100% { opacity: 0; } }
.isi-tl { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; fill: var(--isi-fg); }
.isi-tl-a { animation: isi-tla 9s ease-in-out infinite; animation-delay: -6.2s; }
.isi-tl-b { animation: isi-tlb 9s ease-in-out infinite; animation-delay: -6.2s; }
@keyframes isi-tla { 0%, 36% { opacity: 1; } 46%, 90% { opacity: 0; } 100% { opacity: 1; } }
@keyframes isi-tlb { 0%, 38% { opacity: 0; } 48%, 88% { opacity: 1; } 98%, 100% { opacity: 0; } }
.isi-term { background: var(--isi-cine); border-color: rgba(170, 182, 255, 0.16); color: #e9ecff; gap: 10px; font-family: var(--isi-mono); font-size: 12px; line-height: 1.7; align-content: center; }
.isi-term-bar { display: flex; gap: 6px; padding-bottom: 6px; }
.isi-term-bar i { width: 10px; height: 10px; border-radius: 50%; background: #2b345e; }
.isi-line { display: block; overflow: hidden; white-space: nowrap; width: 0; max-width: 100%; }
.isi-line.l1 { animation: isi-t1 15s steps(34, end) infinite -12s; }
.isi-line.l2 { animation: isi-t2 15s steps(30, end) infinite -12s; }
.isi-line.l3 { animation: isi-t3 15s steps(36, end) infinite -12s; }
.isi-line.l4 { animation: isi-t4 15s steps(32, end) infinite -12s; }
@keyframes isi-t1 { 0% { width: 0; } 12%, 94% { width: 34ch; } 96%, 100% { width: 0; } }
@keyframes isi-t2 { 0%, 16% { width: 0; } 29%, 94% { width: 30ch; } 96%, 100% { width: 0; } }
@keyframes isi-t3 { 0%, 33% { width: 0; } 46%, 94% { width: 36ch; } 96%, 100% { width: 0; } }
@keyframes isi-t4 { 0%, 50% { width: 0; } 62%, 94% { width: 32ch; } 96%, 100% { width: 0; } }
.isi-term .k { color: #8f99ff; } .isi-term .g { color: #34d6c0; } .isi-term .a { color: #ffb547; }
.isi-cursor { display: inline-block; width: 8px; height: 15px; background: #ffb547; vertical-align: -2px; animation: isi-blinkc 1s steps(2, start) infinite; }
@keyframes isi-blinkc { to { visibility: hidden; } }
.isi-pull { grid-column: 1 / -1; font-size: clamp(20px, 3.6vw, 30px); font-weight: 300; line-height: 1.3; padding-block: 8px; text-wrap: balance; }
.isi-pull b { font-weight: 600; color: var(--isi-accent); }
@media (max-width: 760px) { .isi-origin { grid-template-columns: minmax(0, 1fr); } }

/* ---------- Apps rail ---------- */
.isi-rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(172px, 1fr); gap: 22px; overflow-x: auto; scroll-snap-type: x proximity; padding-block: 18px 24px; padding-inline: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; scrollbar-color: var(--isi-line) transparent; }
.isi-rail:focus-visible { outline: 2px solid var(--isi-accent); outline-offset: 4px; border-radius: 12px; }
.isi-app { scroll-snap-align: center; display: grid; gap: 16px; justify-items: center; text-align: center; align-content: start; min-width: 0; }
.isi-phone { position: relative; width: min(100%, 212px); padding: 7px; border-radius: 34px; background: var(--isi-phone); border: 1px solid var(--isi-line); box-shadow: 0 30px 60px -22px var(--isi-glow), 0 0 0 1px rgba(255,255,255,0.04) inset; animation: isi-float 6s ease-in-out infinite; animation-delay: calc(var(--i) * -1.2s); }
.isi-phone::before { content: ""; position: absolute; top: 14px; left: 50%; width: 38px; height: 10px; border-radius: 999px; background: var(--isi-phone); transform: translateX(-50%); z-index: 2; }
.isi-scr { width: 100%; height: auto; border-radius: 27px; overflow: hidden; }
@keyframes isi-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.isi-app h3 { font-size: 17px; }
.isi-app p { font-size: 14px; color: var(--isi-muted); max-width: 26ch; }
.isi-app .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }

/* screen vocabulary (screens stay light inside both themes) */
.isi .s-bg { fill: var(--isi-scr); }
.isi .s-card { fill: var(--isi-scr-card); stroke: var(--isi-scr-line); stroke-width: 1; }
.isi .s-time { font: 600 8px var(--isi-display); fill: var(--isi-scr-ink); }
.isi .s-batt { fill: none; stroke: var(--isi-scr-ink); stroke-width: 1; opacity: .6; }
.isi .s-kick { font: 500 6.5px var(--isi-mono); letter-spacing: 1.6px; }
.isi .s-title { font: 700 19px var(--isi-display); fill: var(--isi-scr-ink); }
.isi .s-sub { font: 400 8.5px var(--isi-display); fill: var(--isi-scr-mute); }
.isi .s-lab { font: 500 8.5px var(--isi-display); fill: var(--isi-scr-ink); }
.isi .s-val { font: 700 8.5px var(--isi-display); fill: var(--isi-scr-ink); }
.isi .s-track { fill: var(--isi-scr-line); }
.isi .s-btn-t { font: 600 9.5px var(--isi-display); fill: #fff; text-anchor: middle; }
.isi .s-home { fill: var(--isi-scr-ink); opacity: .25; }
.isi .s-line { stroke: var(--isi-scr-line); stroke-width: 1; fill: none; }
.isi .c-indigo { fill: var(--isi-s-indigo); } .isi .c-teal { fill: var(--isi-s-teal); } .isi .c-rose { fill: var(--isi-s-rose); } .isi .c-amber { fill: var(--isi-s-amber); }
.isi .x-indigo { stroke: var(--isi-s-indigo); } .isi .x-teal { stroke: var(--isi-s-teal); } .isi .x-rose { stroke: var(--isi-s-rose); } .isi .x-amber { stroke: var(--isi-s-amber); }
.isi .dot-indigo { background: var(--isi-s-indigo); } .isi .dot-teal { background: var(--isi-s-teal); } .isi .dot-rose { background: var(--isi-s-rose); } .isi .dot-amber { background: var(--isi-s-amber); } .isi .dot-cine { background: var(--isi-accent); }

/* Assess */
.isi .a-arm { transform-origin: 86px 146px; animation: isi-arm 6s ease-in-out infinite -2.6s; }
@keyframes isi-arm { 0% { transform: rotate(0); } 40%, 60% { transform: rotate(-150deg); } 100% { transform: rotate(0); } }
.isi .a-arc { stroke-dasharray: 62.8; animation: isi-arc 6s ease-in-out infinite -2.6s; }
@keyframes isi-arc { 0% { stroke-dashoffset: 62.8; } 40%, 60% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 62.8; } }
.isi .a-n { font: 700 15px var(--isi-display); fill: var(--isi-s-indigo); opacity: 0; }
.isi .a-n1 { animation: isi-n1 6s linear infinite -2.6s; } .isi .a-n2 { animation: isi-n2 6s linear infinite -2.6s; } .isi .a-n3 { animation: isi-n3 6s linear infinite -2.6s; } .isi .a-n4 { animation: isi-n4 6s linear infinite -2.6s; }
@keyframes isi-n1 { 0%, 9% { opacity: 1; } 10%, 90% { opacity: 0; } 91%, 100% { opacity: 1; } }
@keyframes isi-n2 { 0%, 9% { opacity: 0; } 10%, 19% { opacity: 1; } 20%, 79% { opacity: 0; } 80%, 89% { opacity: 1; } 90%, 100% { opacity: 0; } }
@keyframes isi-n3 { 0%, 19% { opacity: 0; } 20%, 31% { opacity: 1; } 32%, 67% { opacity: 0; } 68%, 79% { opacity: 1; } 80%, 100% { opacity: 0; } }
@keyframes isi-n4 { 0%, 31% { opacity: 0; } 32%, 67% { opacity: 1; } 68%, 100% { opacity: 0; } }
.isi .a-pulse { transform-box: fill-box; transform-origin: center; animation: isi-halo 2.2s ease-out infinite; }
@keyframes isi-halo { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(3); opacity: 0; } }
.isi .a-bar { transform-box: fill-box; transform-origin: 0 50%; animation: isi-bar 6s ease-in-out infinite -2.6s; }
@keyframes isi-bar { 0% { transform: scaleX(.1); } 40%, 60% { transform: scaleX(1); } 100% { transform: scaleX(.1); } }

/* Posture */
.isi .p-scan { animation: isi-scan 3.6s linear infinite; }
@keyframes isi-scan { 0% { transform: translateY(0); opacity: 0; } 10%, 90% { opacity: .7; } 100% { transform: translateY(176px); opacity: 0; } }
.isi .p-v1, .isi .p-t1 { animation: isi-pa 7s ease-in-out infinite -4s; } .isi .p-v2, .isi .p-t2 { animation: isi-pb 7s ease-in-out infinite -4s; }
@keyframes isi-pa { 0%, 30% { opacity: 1; } 42%, 84% { opacity: 0; } 96%, 100% { opacity: 1; } }
@keyframes isi-pb { 0%, 30% { opacity: 0; } 42%, 84% { opacity: 1; } 96%, 100% { opacity: 0; } }

/* Learn */
.isi .l-ring { stroke-dasharray: 238.8; animation: isi-ring 7s ease-in-out infinite -3.6s; }
@keyframes isi-ring { 0% { stroke-dashoffset: 238.8; } 45%, 88% { stroke-dashoffset: 66.9; } 100% { stroke-dashoffset: 238.8; } }
.isi .l-fill { transform-box: fill-box; transform-origin: center; animation: isi-tick 7s ease-in-out infinite; animation-delay: calc(var(--i) * 1.1s - 4.8s); }
.isi .l-chk { stroke-dasharray: 14; animation: isi-chk 7s ease-in-out infinite; animation-delay: calc(var(--i) * 1.1s - 4.8s); }
@keyframes isi-tick { 0%, 8% { transform: scale(0); } 18%, 88% { transform: scale(1); } 96%, 100% { transform: scale(0); } }
@keyframes isi-chk { 0%, 12% { stroke-dashoffset: 14; } 22%, 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 14; } }

/* Blossoming star */
.isi .b-star { transform-box: fill-box; transform-origin: center; animation: isi-halo 2.6s ease-out infinite; }

/* QLux */
.isi .q-thigh { animation: isi-thigh 1.4s ease-in-out infinite; }
.isi .q-thigh.b { animation-delay: -0.7s; }
.isi .q-shin { animation: isi-shin 1.4s ease-in-out infinite; }
.isi .q-shin.b { animation-delay: -0.7s; }
.isi .q-arm { animation: isi-qarm 1.4s ease-in-out infinite; }
.isi .q-arm.b { animation-delay: -0.7s; }
@keyframes isi-thigh { 0%, 100% { transform: rotate(-30deg); } 50% { transform: rotate(30deg); } }
@keyframes isi-shin { 0%, 45%, 100% { transform: rotate(4deg); } 72% { transform: rotate(62deg); } }
@keyframes isi-qarm { 0%, 100% { transform: rotate(26deg); } 50% { transform: rotate(-26deg); } }
.isi .q-ground { stroke-dasharray: 6 8; animation: isi-ground 0.55s linear infinite; }
@keyframes isi-ground { to { stroke-dashoffset: -14; } }
.isi .q-sprock { animation: isi-sprock 1s linear infinite; }
@keyframes isi-sprock { to { transform: translateY(14px); } }
.isi .q-wave { animation: isi-qwave 1.4s linear infinite; }
@keyframes isi-qwave { to { transform: translateX(-44px); } }
.isi .q-play { animation: isi-play 6s linear infinite; }
@keyframes isi-play { 0% { transform: translateX(0); } 100% { transform: translateX(160px); } }

/* ---------- Pod loop ---------- */
.isi-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
.isi-step { position: relative; background: var(--isi-surface); border: 1px solid var(--isi-line); border-radius: 22px; padding: 18px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.isi-step svg { width: 100%; height: auto; background: var(--isi-raise); border-radius: 14px; }
.isi-step p { font-size: 15px; color: var(--isi-muted); }
.isi-step::after { content: ""; position: absolute; top: 50%; right: -20px; width: 12px; height: 12px; border-top: 3px solid var(--isi-accent); border-right: 3px solid var(--isi-accent); transform: translateY(-50%) rotate(45deg); animation: isi-chev 1.6s ease-in-out infinite; }
.isi-step:last-child::after { display: none; }
@keyframes isi-chev { 0%, 100% { translate: -3px 0; opacity: .4; } 50% { translate: 4px 0; opacity: 1; } }
@media (max-width: 820px) {
  .isi-steps { grid-template-columns: minmax(0, 1fr); gap: 32px; }
  .isi-step::after { top: auto; bottom: -22px; right: auto; left: 50%; transform: translateX(-50%) rotate(135deg); }
}
.isi-r1, .isi-r2, .isi-r3 { transform-box: fill-box; transform-origin: center; }
.isi .pc { animation: isi-float2 3.4s ease-in-out infinite; }
.isi .pc.b { animation-delay: -1.1s; } .isi .pc.c { animation-delay: -2.2s; }
@keyframes isi-float2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.isi .broad { transform-box: fill-box; transform-origin: center; fill: none; stroke: var(--isi-accent); stroke-width: 1.4; animation: isi-broad 3s ease-out infinite; }
.isi .broad.b { animation-delay: -1s; } .isi .broad.c { animation-delay: -2s; }
@keyframes isi-broad { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
.isi .scrglow { animation: isi-glowscr 2.4s ease-in-out infinite; }
.isi .scrglow.b { animation-delay: -.8s; } .isi .scrglow.c { animation-delay: -1.6s; }
@keyframes isi-glowscr { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.isi .noz { animation: isi-nozup 5s ease-in-out infinite; }
.isi .noz-x { animation: isi-nozx 0.9s ease-in-out infinite alternate; }
.isi .obj { transform-box: fill-box; transform-origin: 50% 100%; animation: isi-objgrow 5s ease-in-out infinite; }
@keyframes isi-nozup { 0% { transform: translateY(72px); } 85%, 100% { transform: translateY(30px); } }
@keyframes isi-nozx { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
@keyframes isi-objgrow { 0% { transform: scaleY(0.04); } 85%, 100% { transform: scaleY(1); } }
.isi .tile { transform-box: fill-box; transform-origin: center; animation: isi-tile 6s ease-in-out infinite; animation-delay: calc(var(--i) * .7s - 4.5s); }
@keyframes isi-tile { 0%, 8% { transform: scale(.5); opacity: .2; } 20%, 86% { transform: scale(1); opacity: 1; } 96%, 100% { transform: scale(.5); opacity: .2; } }

.isi-bars4 { display: grid; gap: 0; border-top: 1px solid var(--isi-line); }

.isi-radar svg { width: 100%; height: auto; overflow: visible; }

/* ---------- Native feel (stage 1 of the premium redesign) ---------- */
html,body{overflow-x:clip}
html{overscroll-behavior-y:none;-webkit-touch-callout:none}

.card.list{padding:2px 14px}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border:none;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;min-height:56px}
.trow:last-child{border-bottom:none}

.sic{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

.trow .chip{white-space:normal;max-width:38%;text-align:center;line-height:1.25;font-size:11px}

/* splash */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(70% 45% at 50% 42%,rgba(255,214,10,.12),transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .35s ease}

#splash .rpdraw{width:112px;height:112px}
.rpdraw path{stroke-dasharray:1;stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){
  .rpdraw g path{stroke-dashoffset:1;animation:draw .38s cubic-bezier(.3,.7,.2,1) forwards;animation-delay:calc(.08s + var(--i) * .07s)}
  .rpdraw .arc{stroke-dashoffset:1;animation:draw .5s cubic-bezier(.3,.7,.2,1) .5s forwards}
  .rpdraw .dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:popin .45s cubic-bezier(.3,1.6,.5,1) .38s forwards}
  #splash .wordmark,#splash .tagline,.wbrand .wordmark,.wbrand .tagline{animation:rise .5s cubic-bezier(.2,.7,.2,1) .55s both}
  #splash .tagline,.wbrand .tagline{animation-delay:.68s}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes popin{to{transform:scale(1)}}

}

/* screen transitions */
@media (prefers-reduced-motion:no-preference){

  @keyframes navf{from{opacity:.001;transform:translateX(28px)}}
  @keyframes navb{from{opacity:.001;transform:translateX(-28px)}}
  @keyframes navx{from{opacity:.001;transform:translateY(6px)}}
  .nav-fwd .stack>*,.nav-fade .stack>*{animation:rise .42s cubic-bezier(.2,.7,.2,1) both}
  .nav-fwd .stack>:nth-child(2),.nav-fade .stack>:nth-child(2){animation-delay:.03s}
  .nav-fwd .stack>:nth-child(3),.nav-fade .stack>:nth-child(3){animation-delay:.06s}
  .nav-fwd .stack>:nth-child(4),.nav-fade .stack>:nth-child(4){animation-delay:.09s}
  .nav-fwd .stack>:nth-child(n+5),.nav-fade .stack>:nth-child(n+5){animation-delay:.12s}
  .cline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.4,.1,.2,1) .15s forwards}
  .pbar i{animation:grow .8s cubic-bezier(.2,.7,.2,1) .15s both}
  @keyframes grow{from{width:0}}
  .pro-chip{background-size:220% 100%;animation:shine 1.6s ease .5s 1 both}
  @keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
  .tabs button[aria-current="page"] svg{animation:tabpop .38s cubic-bezier(.3,1.6,.5,1)}
  @keyframes tabpop{40%{transform:scale(1.18) translateY(-1px)}}
  .toast:not([hidden]){animation:toastin .3s cubic-bezier(.2,.8,.2,1)}

}

/* tab bar: floating, with the gold + in the middle */

html:has(body.lightpage){background:#f7f5ef}
.timer.idle .tmface circle.on{opacity:0}
body.lightpage{--bg:#f7f5ef;--ink:#16150f;--muted:#6b665a;--line:#e3ddcd;--surface:#fff;--raised:#fff;--sunk:#efeadd;background:#f7f5ef;color-scheme:light}
body.lightpage header{background:color-mix(in srgb,#f7f5ef 90%,transparent);border-color:transparent}
body.lightpage .bar{background:color-mix(in srgb,#fff 92%,transparent)}
body.lightpage .back{background:#ece7da;color:#16150f}
.lhead h1{font-size:23px}
.lcard{background:#fff;border:1px solid #e6e1d4;border-radius:20px;padding:14px;box-shadow:0 10px 24px -18px rgba(0,0,0,.35)}
.lcard p{margin:6px 0 0;font-size:14px;color:#3d3a32}
.lcard.body{display:flex;gap:14px;align-items:center}
.lcard.body .label{color:#9a6b00}
.bodyart{width:116px;flex:none;height:auto}
.bodyart .b1{fill:#f1e7d3;stroke:#c4ad85;stroke-width:2}
.bodyart .b2{fill:#f8f1e4;stroke:#c4ad85;stroke-width:1.5}
.bodyart .hl{fill:rgba(255,214,10,.14);stroke:#e0a400;stroke-width:1.6;stroke-dasharray:4 4}
.bodyart .gold{fill:none;stroke:#e0a400;stroke-width:6;stroke-linecap:round}
.bodyart .gold.dash{stroke-width:2;stroke-dasharray:5 5}
.bodyart .goldf{fill:#e0a400}
.bodyart .limb{fill:none;stroke:#c4ad85;stroke-width:9;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.bodyart .hl{transform-box:fill-box;transform-origin:center;animation:breathe 2.6s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.08);opacity:.7}}}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font:650 12px var(--body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:#dcf5e6;color:#1d7a46}.pill.a{background:#fff1d6;color:#8a5200}.pill.n{background:#eeeae0;color:#5a5548}
.lbar{height:10px;border-radius:6px;background:#ece7da;overflow:hidden;margin-top:10px}
.lbar i{display:block;height:100%;width:var(--w);border-radius:6px;background:linear-gradient(90deg,#ffd60a,#5bd38b)}
@media (prefers-reduced-motion:no-preference){.lbar i{animation:grow 1s cubic-bezier(.2,.7,.2,1) .2s both}}
.lwork{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lwork .lcard{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;text-align:center;font-size:13px;font-weight:600}
.lwork svg{width:26px;height:26px;fill:none;stroke:#b07d00;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Reasoning, goals, change check (stage 3) ---------- */
.sechead{align-items:center;margin-top:8px}.sechead .sec{margin:0}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.goal:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.goal b{font-weight:650;line-height:1.3}
.goal.met{border-color:#1f4a2e;background:linear-gradient(140deg,#10241a,#141414 70%)}
.goal.met .pbar i{background:var(--good)}
.goal .lrow .chip{flex:none}
.primary-soft{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:700}
.cb{display:inline-block;margin-left:6px;font:700 10.5px var(--body);letter-spacing:.02em;padding:3px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.cb.real{background:var(--accent);color:var(--accent-ink)}.cb.worse{background:var(--bad-soft);color:var(--bad)}.cb.noise,.cb.same{background:var(--sunk);color:var(--muted)}
.sdelta .cb{display:block;margin:3px 0 0;text-align:center}
.reality{display:flex;flex-direction:column;gap:8px}
.reality .lrow{flex-wrap:wrap}
.rrow{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink)}
.rrow i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;flex:none;background:var(--sunk);color:var(--muted)}
.rrow.good i{background:var(--good-soft);color:var(--good)}.rrow.warn i{background:var(--warn-soft);color:var(--warn)}
details.why{padding:0}
details.why summary{list-style:none;display:flex;gap:10px;align-items:center;padding:13px 14px;cursor:pointer}
details.why summary::-webkit-details-marker{display:none}
details.why summary b{flex:1;font-weight:650;line-height:1.35}
details.why[open] .chev{transform:rotate(90deg)}
details.why .chev{transition:transform .2s}
details.why ul{margin:0 14px 12px;padding-left:18px;color:var(--muted);font-size:13.5px}
.goalopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.goalopt small{color:var(--muted);font-weight:400}
.assessor{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border-radius:16px;background:var(--surface)}
.assessor svg{width:22px;height:22px;color:var(--accent)}
.assessor small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.offl{display:inline-block;margin-left:6px;font:700 10.5px var(--body);padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}

/* ---------- Pilot kit ---------- */
.pilotbar{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border-radius:16px;background:var(--accent-soft);border-color:var(--accent-line)}
.pilotbar svg{width:22px;height:22px;color:var(--accent)}
.pilotbar small{display:block;font-size:11.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

</style>

const lrn = (label, unit, extra) => ({ t: "lrnum", label, unit, ...extra });
const lrs = (label, opts, extra) => ({ t: "lrsel", label, opts, ...extra });
const tx = (id, label, extra) => ({ id, t: "text", label, ...extra });
const ar = (id, label, extra) => ({ id, t: "area", label, ...extra });

function T(def) {
  def.fields.forEach((f, i) => {
    f.id = f.id || "f" + i;
    if (f.t === "scale") f.o = f.opts.map((o, j) => Array.isArray(o) ? { v: o[0], l: o[1] } : { v: j + (f.base || 0), l: o });
    if (f.t === "sel") f.o = f.opts.map(o => ({ v: o, l: o }));
  });
  return def;
}
const has = x => x !== undefined && x !== null && x !== "";
function tally(t, v, filter) {
  let sum = 0, n = 0, ans = 0, max = 0, min = 0;
  for (const f of t.fields) {
    if (f.t !== "scale" || f.noscore || (filter && !filter(f))) continue;
    n++; const vals = f.o.map(o => +o.v); max += Math.max(...vals); min += Math.min(...vals);
    if (has(v[f.id])) { ans++; sum += +v[f.id]; }
  }
  return { sum, n, ans, max, min };
}
function bandOf(x, list) { for (const b of list) if (x <= b[0]) return [b[1], b[2]]; return list.at(-1).slice(1); }
const mmtNum = g => parseFloat(g) + (/\+$/.test(g) ? 0.3 : /-$/.test(g) ? -0.3 : 0);
const lr = (v, id) => v[id] || {};

// Tool records (Posture and Gait Analysis) carry the score the tool calculated; bands match the tool's own colours.
function toolScore(v, what) {
  if (!has(v.score)) return { val: null, txt: "Not scored", band: ["Not scored", "neutral"] };
  const n = Math.round(+v.score);
  return { val: n, max: 100, txt: `${n}/100`, band: n >= 80 ? [v.rating || `Good ${what.toLowerCase()}`, "good"] : n >= 60 ? [v.rating || "Some areas to train", "warn"] : [v.rating || "Areas to treat", "bad"] };
}

// Chart scale: the test's real maximum (e.g. Berg 56) when its definition gives one, otherwise the old automatic range.
function chartRange(s, t) {
  const vs = s.map(x => x.val), ms = s.map(x => x.max).filter(m => typeof m === "number" && isFinite(m)), top = t.max ?? (ms.length ? Math.max(...ms) : null);
  if (top != null) { const lo = t.id === "gcs" ? 3 : 0; if (top > lo && vs.every(v => v >= lo && v <= top)) return [lo, top]; }
  const hi = Math.max(...vs) * 1.15, lo = Math.min(0, ...vs); return [lo, hi === lo ? lo + 1 : hi];
}
function chartSVG(s, t) {
  const W = 320, H = 150, L = 34, R = 14, Tp = 14, B = 26, vs = s.map(x => x.val);
  const [lo, hi] = chartRange(s, t);
  const x = i => L + (s.length === 1 ? 0 : i * (W - L - R) / (s.length - 1)), y = v => Tp + (hi - v) * (H - Tp - B) / (hi - lo);
  const nice = v => Math.round(v * 10) / 10;
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${nice(v)}</text>`).join("");
  const pts = s.map((p, i) => [x(i), y(p.val), p]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts.at(-1)[0]},${y(lo)} L${pts[0][0]},${y(lo)} Z`;
  const dots = pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>${i === 0 || i === pts.length - 1 || s.length <= 5 ? `<text x="${p[0]}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}" class="ax">${fmtShort(p[2].date)}</text>` : ""}`).join("");
  const last = pts.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.name)} over time">${grid}<path d="${area}" fill="var(--accent)" opacity=".1"/><path class="cline" d="${line}" pathLength="1" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${last[0] - 9}" y="${last[1] - 9}" text-anchor="end" class="ax strong">${nice(last[2].val)}</text></svg>`;
}

/* ---------- Guided sessions ----------
   A visit runs as one flow: plan the tests (suggested from the diagnosis and earlier visits), answer each test one page at a time
   with how-to-test tips and safety cues, time the timed tests with a built-in stopwatch, then see the session summary,
   explain it to the patient in plain words, or print the professional PDF. */

/* How-to-test tips. "how" shows on a test's first page, items[i] on that item's page, "safe" is a standing safety reminder. */
const BERG_TIPS = ["Patient sits on a chair with arms. Ask them to stand without using their hands if they can.", "Ask them to stand for 2 minutes without holding on. Score the first attempt.", "Patient sits on a bed or stool, feet flat, arms folded, for 2 minutes.", "Ask them to sit down from standing. Watch for control and use of hands.", "Set up a pivot transfer between two chairs, one with arms and one without.", "Ask them to close their eyes and stand still for 10 seconds.", "Ask them to place feet together and stand for 1 minute without holding on.", "Arm raised to 90°, fingers stretched. Measure how far they reach forward without stepping.", "Place a shoe or slipper in front of the feet and ask them to pick it up.", "Ask them to turn and look behind over the left shoulder, then the right.", "Ask them to turn a full circle, pause, then turn a full circle the other way.", "Ask them to place each foot alternately on a step or stool, 4 times each.", "Demonstrate: one foot directly in front of the other. If not possible, step far ahead.", "Ask them to stand on one leg as long as they can without holding on."];
const TIPS = {
  berg: { how: "Score the lowest category that applies. Use a stopwatch, a ruler, a step and two chairs.", items: BERG_TIPS, safe: "Stand close and guard. Use a gait belt if balance is poor." },
  tinetti: { how: "Use a firm armless chair. For gait, ask the patient to walk at their usual pace with their usual aid.", safe: "Stay alongside, especially on turns and the eyes-closed item." },

  const n = goalNow(pid, g), cur = n ? n.v : g.base, span = g.target - g.base, pct = span ? Math.max(0, Math.min(1, (cur - g.base) / span)) : 1;
  return { cur, pct, met: g.hb ? cur >= g.target : cur <= g.target, late: !g.met && g.by < today() };
}
// Mark goals met after a save, with one celebration per goal.
function checkGoals(pid) {
  const p = P(pid); let hit = null;
  for (const g of p?.goals || []) { if (g.met || !g.tid) continue; const pr = goalProgress(pid, g); if (pr.met && goalNow(pid, g)) { g.met = today(); hit = g; } }

}
function goalsHTML(pid, compact) {
  const gs = P(pid)?.goals || []; if (!gs.length) return compact ? "" : `<div class="empty">No goals yet. Suggested goals use each test's clinically meaningful change.</div>`;
  return gs.slice().sort((a, b) => (a.met ? 1 : 0) - (b.met ? 1 : 0)).map(g => { const pr = goalProgress(pid, g);
    return `<div class="goal ${g.met ? "met" : ""}" ${compact ? "" : `role="button" tabindex="0" data-act="goalEdit" data-pid="${pid}" data-id="${g.id}" aria-label="Edit goal: ${esc(g.text)}"`}><div class="lrow"><b>${esc(g.text)}</b>${g.met ? `<span class="chip good">Reached ${fmtShort(g.met)}</span>` : pr.late ? `<span class="chip warn">Due ${fmtShort(g.by)}</span>` : `<span class="chip neutral">By ${fmtShort(g.by)}</span>`}</div>
      ${g.tid ? `<div class="pbar"><i style="--w:${Math.round(100 * pr.pct)}%"></i></div><div class="psub">Now ${esc(pr.cur)}${esc(g.unit || "")} · target ${esc(g.target)}${esc(g.unit || "")} · ${Math.round(100 * pr.pct)}% of the way</div>` : `<div class="psub">${g.met ? "Marked as reached" : "Tracked by you · tap to update"}</div>`}${g.note ? `<div class="psub">${esc(g.note)}</div>` : ""}</div>`; }).join("");
}

/* "Is this change real?": compares the change with the test's MCID, the measurement method and the assessor. */
function changeBadge(t, c) {
  if (!c || c.d == null) return ""; if (c.d === 0) return `<span class="cb same">No change</span>`;
  if (!t.mcid) return "";
  if (Math.abs(c.d) >= t.mcid) return c.better ? `<span class="cb real">★ Meaningful change</span>` : c.better === false ? `<span class="cb worse">Meaningful decline</span>` : `<span class="cb real">Meaningful change</span>`;
  return `<span class="cb noise">Within measurement error</span>`;
}
function realityHTML(a) {
  const t = getTpl(a), p = P(a.pid), c = compare(t, a, p), r = runScore(t, a.values, p), prev = c?.prev, rows = [];
  if (c?.d != null && t.mcid) rows.push(Math.abs(c.d) >= t.mcid ? ["good", `The change of ${c.d > 0 ? "+" : ""}${c.d} is at least the ${t.mcid}-point minimal clinically important difference, so it is likely a real change the patient can feel.`] : ["neutral", `The change of ${c.d > 0 ? "+" : ""}${c.d} is smaller than the ${t.mcid}-point minimal clinically important difference. It may be measurement error; confirm at the next visit.`]);
  if (t.id === "rom" && prev) { const now = romRows(a), was = romRows(prev); now.forEach(x => { const y = was.find(w => w.f.id === x.f.id && w.s === x.s); if (y && x.v !== y.v) rows.push([Math.abs(x.v - y.v) >= ROM_MDC ? "good" : "neutral", `${x.f.label} ${x.s}: ${x.v - y.v > 0 ? "+" : ""}${x.v - y.v}° ${Math.abs(x.v - y.v) >= ROM_MDC ? "is beyond" : "is within"} the ${ROM_MDC}° goniometry error.`]); }); }
  if (r.of) rows.push(r.done < r.of ? ["warn", `${r.of - r.done} of ${r.of} items are not scored, so the total may read low.`] : ["good", "Every item is scored."]);
  if (a.values.gonio && prev?.values.gonio) { const m1 = new Map(a.values.gonio.split(";").map(x => x.split(":"))), m0 = new Map(prev.values.gonio.split(";").map(x => x.split(":")));
    const diff = [...m1].filter(([k, m]) => m0.has(k) && m0.get(k) !== m); rows.push(diff.length ? ["warn", `${diff.length} reading${diff.length > 1 ? "s use" : " uses"} a different method from last time (camera or tilt). Compare with care.`] : ["good", "Same measuring method as last time."]); }
  if (prev && a.by && prev.by) rows.push(a.by === prev.by ? ["good", "Same assessor as last time."] : ["warn", `Assessed by ${a.by}; last time by ${prev.by}. Results between testers vary more.`]);

}

/* The goal editor: wording, the linked measure (or none, for a goal you track yourself), start, target, due date and notes. */
function goalMeasures(pid) {
  const out = [];
  for (const { t, r, a } of Object.values(latestResults(pid))) {
    if (t.id === "rom") { romRows(a).forEach(y => out.push({ key: `rom|${y.f.id}|${y.s}`, tid: "rom", f: y.f.id, s: y.s, label: `${y.f.label} ${y.s === "L" ? "left" : "right"}`, cur: y.v, unit: "°", hb: true })); continue; }

// What we attach to each note: the screen and phone, nothing about patients.
function fbContext(screen) {
  const ua = navigator.userAgent, os = /iPhone|iPad/.test(ua) ? "iOS" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Other",
    br = /CriOS|Chrome/.test(ua) ? "Chrome" : /FxiOS|Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "Other";
  return { screen, v: APP_V, os, browser: br, size: `${innerWidth}×${innerHeight}`, installed: matchMedia("(display-mode: standalone)").matches || navigator.standalone === true, mode: db.settings.mode || "clinic", day: pilotDay() };
}

async function fbSend() {
  const list = fbList().filter(f => !f.sent); if (!list.length) { toast("Nothing new to send"); return; }
  const text = fbText(list), to = (db.settings.pilotTo || "").trim(), mark = () => { list.forEach(f => f.sent = today()); save(); render(); };
  try { if (navigator.share) { await navigator.share({ title: "MotionPlus feedback", text }); mark(); return; } } catch (e) { if (e.name === "AbortError") return; }
  if (to) { location.href = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent("MotionPlus pilot feedback")}&body=${encodeURIComponent(text)}`; mark(); return; }
  try { await navigator.clipboard.writeText(text); mark(); toast("Copied. Paste it into a message to the pilot lead."); } catch (e) { downloadFile("motionplus-feedback.txt", text, "text/plain"); mark(); }
}

let draft = null;
function startForm(pid, tid, aid) {
  if (tid === "session") return go("plan", pid);
  if (!aid && (tid === GONIO || TPLMAP[tid]?.tool) && needConsent(pid, () => startForm(pid, tid))) return;
  if (tid === GONIO) return go("gonio", pid);
  const tt = TPLMAP[aid ? A(aid)?.tid : tid];
  if (tt?.tool) return go("tool", tt.tool, aid ? A(aid).pid : pid, aid || null);
  if (aid) { const a = A(aid); draft = JSON.parse(JSON.stringify(a)); }
  else { const t = allTpl().find(x => x.id === tid); draft = { id: uid(), pid, tid, date: today(), values: {}, notes: "", created: Date.now() };

const REPORT_RULES = `You are a senior rehabilitation clinician writing a professional clinical report for a rehabilitation clinic (physiotherapy, occupational therapy, speech and language therapy, behavioural and sensory services). The report must read like one written by an experienced specialist: precise, evidence-based, and easy to follow for referrers, the treating team and families.

Rules:
- Use only the data provided. Never invent results, history, diagnoses or test names. If key information is missing, say what should be assessed next.
- The patient is identified only by a code. Never add or guess a name.
- Interpret every score against the published cut-offs, norms and bands given in the data. State whether change between dates is clinically meaningful when a threshold is given.
- Link impairments to activity and participation (ICF framework) and to safety risks such as falls, aspiration or self-harm where the data supports it. Flag any urgent safety item first.
- Write in clear professional English. Short paragraphs and bullet points. No filler.
- Format: plain text. Section headings are lines starting with "## ". Bullets are lines starting with "- ". Use **double asterisks** for key figures. No tables, no other markdown.

Sections, in this order:
## Summary
## Assessment findings
## Clinical interpretation
## Functional impact and risks
## Goals
(2–3 short-term goals for the next 2–4 weeks and 1–2 long-term goals; all SMART and measurable with the tests used)
## Recommendations and plan

(3–5 sentences in plain words, no jargon)

{"name": string, "discipline": "PT"|"OT"|"Speech"|"Behavioural"|"Sensory"|"Neuro"|"Paeds"|"Cardio"|"General", "description": string (one sentence), "higherIsBetter": boolean,
 "fields": [{"type": "heading"|"score"|"choice"|"checklist"|"number"|"left-right-number"|"left-right-choice"|"text"|"long-text", "label": string, "options": [...], "unit": string}],

const LIBS = { pdf: ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"], docx: ["https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"], jspdf: ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"] };

function parseFormText(text) {
